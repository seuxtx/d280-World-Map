<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D280 World Map</title>
</head>

<body class="TF2Professor">
    
  <table>
    <th>
      <h1>World Map</h1>
    </th>
    <th>
      <h2>Country Stats</h2>
    </th>
    <tr>
      <td id="map">
        <app-map></app-map>
      </td>
      <td>
        <ol>
          <li>Country: <span>{{ countryName }}</span></li>
          <li>Country Capital: <span>{{ countryCap }} </span></li>
          <li>Country Latitude & Longitude: <span>{{ countryLongLat }}</span></li>
          <li>Country Income: <span>{{ countryIncome }}</span></li>
          <li>Country Region: <span>{{ countryRegion }}</span></li>
        </ol>
      </td>
    </tr>

  </table>
  </body>
</html>
